<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Science Quest</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;800&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c1130;--pn:#16204a;--ln:#2c3a7a;--cy:#34e1d3;--am:#ffc94d;--pk:#ff5d8f;--tx:#eef2ff;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*{box-sizing:border-box}

#app{position:relative;height:100%;overflow:hidden;background:radial-gradient(circle at 50% 20%,#1b2a74,var(--bg) 70%)}
.scr{display:none;position:absolute;inset:0;overflow:auto;padding:16px;flex-direction:column;align-items:center;justify-content:safe center}
.scr.on{display:flex}.scr>*{max-width:720px;width:100%}
h1{font:clamp(26px,7vw,52px)/1.3 'Press Start 2P',system-ui,monospace;margin:6px 0;color:var(--am);text-shadow:4px 4px 0 #b8421f,8px 8px 0 #1b2a74;animation:bob 2.4s steps(4) infinite}
h2{margin:6px 0 10px;font:15px/1.5 'Press Start 2P',system-ui,monospace}.sub{color:var(--cy);font-size:20px;margin:0 0 14px}
button{font:11px/1.4 'Press Start 2P',system-ui,monospace;color:var(--tx);background:#243068;border:0;border-bottom:4px solid #121a44;border-radius:2px;box-shadow:0 0 0 2px #05081a;padding:10px 14px;cursor:pointer;min-height:44px}
button:hover{background:#2e3d84}button:active{transform:translateY(2px);border-bottom-width:2px}
button.pri{background:var(--am);color:#2a1b00;border-bottom-color:#b8860b}button:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:3px solid var(--cy);outline-offset:2px}
select{font:inherit;padding:10px;border-radius:10px;background:#0c1130;color:var(--tx);border:2px solid var(--ln)}
#menu{text-align:center}.mb{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:8px}.mb .pri{grid-column:1/-1;font-size:14px}
.prof{position:absolute;top:12px;right:12px;background:var(--pn);border:2px solid var(--ln);border-radius:20px;padding:4px 14px;width:auto;font-size:15px}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;text-align:center}.grid>div{background:var(--bg);border-radius:12px;padding:10px;font-size:14px}.grid b{display:block;font-size:26px;color:var(--am)}
.bd{opacity:.4;filter:grayscale(1)}.bd.on{opacity:1;filter:none;border-color:var(--am)}
.ov{position:absolute;inset:0;background:rgba(5,8,25,.85);display:none;align-items:center;justify-content:center;padding:12px;overflow:auto;z-index:5}.ov.on{display:flex}
.ov .card{max-width:640px;width:100%;margin:auto}.ov .sm{max-width:320px;display:grid;gap:10px}
.qh{display:flex;justify-content:space-between;color:var(--cy);font-size:14px}.op{display:block;width:100%;text-align:left;margin:8px 0}
.op.good{background:#14805a}.op.bad{background:#a3284f}.op.off{opacity:.25}.fb{margin:8px 0;min-height:24px}
#game{padding:0;background:#000;align-items:stretch}#game>*{max-width:none}
#hud{display:flex;gap:12px;align-items:center;padding:6px 10px;background:#0a0f2a;font-size:15px;flex-wrap:wrap}#hud b{flex:1;color:var(--am)}#hud button{min-height:36px;padding:2px 12px}
#cv{flex:1;min-height:0;width:100%;height:100%;object-fit:contain;background:#000;display:block}
#tc{position:absolute;left:0;right:0;bottom:calc(8px + env(safe-area-inset-bottom,0px));display:none;justify-content:space-between;padding:0 12px;pointer-events:none}
#tc div{display:flex;gap:10px}#tc button{pointer-events:auto;width:64px;height:64px;border-radius:50%;opacity:.8;touch-action:none;user-select:none;font-size:22px;padding:0}
@media (hover:none),(pointer:coarse),(max-width:700px){#tc{display:flex}}
#toast{position:absolute;top:60px;left:50%;transform:translateX(-50%);background:#000d;border:1px solid var(--cy);padding:6px 16px;border-radius:20px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9;width:auto}#toast.on{opacity:1}
.stars{font-size:48px;color:var(--am);text-align:center;animation:pop .6s}@keyframes pop{from{transform:scale(.2)}to{transform:scale(1)}}
.cf{position:absolute;top:-10px;width:10px;height:14px;animation:cf 3s linear forwards;pointer-events:none;max-width:10px}@keyframes cf{to{transform:translateY(110vh) rotate(720deg)}}
.cmp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}.cmp b{display:block;font-size:30px;color:var(--am)}
textarea{width:100%;background:var(--bg);color:var(--tx);border:2px solid var(--ln);border-radius:10px;padding:8px;font:13px monospace}
li{margin:4px 0}.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.scr.on{animation:fi .35s steps(6)}@keyframes fi{from{opacity:0;transform:translateY(12px)}}@keyframes bob{50%{transform:translateY(-6px)}}.mb button:hover{transform:translateY(-3px)}#cv,#ec,#mc{image-rendering:pixelated}.op{font:700 18px 'Baloo 2',system-ui,sans-serif}small{font-size:14px}input{font:inherit;padding:8px;border-radius:4px;background:#0c1130;color:var(--tx);border:2px solid var(--ln);min-width:0}.row input{flex:1}#cre input{width:100%;margin:3px 0}#cre .row input{width:auto}#cre>*{max-width:980px}#ec{width:100%;height:auto;border:3px solid var(--ln);touch-action:none;display:block}.tl button{font-size:20px;min-width:48px}.tl button.on{background:var(--am);color:#2a1b00}:root{--bg:#0a0f26;--pn:#121a3d;--ln:#232e66;--cy:#5eead4}#app{background:var(--bg)}button{font:600 16px 'Baloo 2',system-ui,sans-serif;background:#1a2459;border:0;border-radius:10px;box-shadow:none;padding:10px 18px;transition:background .15s}button:hover{background:#243179}button:active{transform:none;background:#2d3d94}button.pri{background:var(--cy);color:#06241f}button.pri:hover{background:#8ef3e3}.mb button:hover{transform:none}h1{font:clamp(24px,6vw,44px)/1.3 'Press Start 2P',monospace;color:#fff;text-shadow:none;animation:none}h2{font:700 24px 'Baloo 2',system-ui,sans-serif}.sub{color:#9aa6e0;font-size:18px}.card,.wc{background:var(--pn);border:0;border-radius:14px}.wc{border-left:0}.prof{background:none;border:0;color:#9aa6e0}.fl{display:none}.mb{grid-template-columns:repeat(2,1fr)}.mb .pri{grid-column:1/-1;font-size:20px;min-height:52px}.ft{display:flex;flex-wrap:wrap;justify-content:center;gap:2px;margin-top:16px}.ft button{background:none;color:#9aa6e0;font-size:15px;min-height:36px;padding:4px 10px}.ft button:hover{background:#1a2459;color:#fff}.note{background:none;border:0;border-left:3px solid var(--am);border-radius:0;color:#c9d0f5}.tl button{font-size:15px;min-width:0}.tl button.on{background:var(--cy);color:#06241f}#hud{background:#070b1d;font-size:15px}#hud button{background:none;font-size:18px;padding:2px 10px}.op{background:#1a2459}.op:hover{background:#243179}.op.good{background:#14805a}.op.bad{background:#a3284f}.wc .row{margin:0}.mb{grid-template-columns:repeat(auto-fit,minmax(110px,1fr))}#shop>*{max-width:900px}.cs{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}.cs .card{text-align:center;margin:0}.cs p{font-size:14px;margin:6px 0;color:#9aa6e0}.sg{display:grid;grid-template-columns:repeat(auto-fill,minmax(116px,1fr));gap:8px}.sk{background:var(--pn);border-radius:12px;padding:8px;border-bottom:4px solid var(--rc);display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}.sk canvas,.ri canvas{width:54px;height:75px;image-rendering:pixelated}.sk.lk canvas{filter:brightness(0);opacity:.35}.sk.on{outline:2px solid var(--cy)}.sk button{padding:4px 10px;min-height:32px;font-size:14px;margin-top:4px}.rw{position:relative;overflow:hidden;background:#070b1d;border-radius:12px;height:130px}.rs{display:flex;position:absolute;left:0;top:0;height:100%}.ri{flex:none;width:110px;display:flex;flex-direction:column;align-items:center;justify-content:center;border-bottom:4px solid var(--rc);font-size:13px;text-align:center}.pt{position:absolute;left:50%;top:0;bottom:0;width:3px;background:#fff;z-index:2}#rr{text-align:center;min-height:100px;margin-top:10px}@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div id="app">
<section class="scr on" id="menu"></section><section class="scr" id="worlds"></section><section class="scr" id="how"></section>
<section class="scr" id="ach"></section><section class="scr" id="stats"></section><section class="scr" id="res"></section>
<section class="scr" id="set"></section><section class="scr" id="vic"></section><section class="scr" id="cre"></section><section class="scr" id="shop"></section><section class="scr" id="rm"></section>
<section class="scr" id="game">
<div id="hud"><b id="hw"></b><span id="hl"></span><span id="hb"></span><span id="hc"></span><span id="hs"></span><span id="ht"></span><button data-a="mute" aria-label="Sound">🔊</button><button data-a="pause" aria-label="Pause">⏸</button></div>
<canvas id="cv" width="960" height="540"></canvas>
<div id="tc"><div><button data-k="left" aria-label="Left">◀</button><button data-k="right" aria-label="Right">▶</button></div><div><button data-k="e" aria-label="Interact">E</button><button data-k="jump" aria-label="Jump">▲</button></div></div>
</section>
<div id="ov" class="ov"></div><div id="toast"></div>
</div>
<script>
"use strict";
const $=s=>document.querySelector(s);
/* ---------- Content: [topic, question, correct, wrong1, wrong2, wrong3, explanation] ---------- */
const W=[
{id:'phys',name:'Physics Laboratory',d:'Circuits, magnets, light and forces.',c:['#0b1f4a','#34e1d3','#14336e'],tp:['Electricity','Magnets','Light','Force & motion'],q:[
[0,'Which material is the best electrical conductor?','Copper','Rubber','Glass','Dry wood','Copper has electrons that move freely. Rubber, glass and dry wood are insulators.'],
[1,'What happens when two north poles of magnets meet?','They repel','They attract','Nothing','They melt','Like poles repel; opposite poles attract.'],
[2,'A mirror forms an image mainly by…','Reflection','Refraction','Absorption','Combustion','Smooth surfaces reflect light rays regularly, forming an image. Refraction is bending at a boundary.'],
[3,'Which unit measures force?','Newton','Joule','Watt','Volt','The newton (N). Joules measure energy, watts power, volts electrical potential difference.'],
[0,'For a bulb to light, the circuit must be…','A closed loop with a power source','An open loop with a battery','Made only of insulators','Without any wires','Current needs a complete conducting loop. A gap, such as an open switch, stops it.'],
[1,'Which object is attracted to a magnet?','An iron nail','A plastic spoon','A glass marble','A wooden pencil','Iron is a magnetic material. Plastic, glass and wood are not.'],
[2,'The law of reflection: the angle of incidence equals…','The angle of reflection','The angle of refraction','90 degrees','The mirror thickness','Light leaves a flat mirror at the same angle it arrived, both measured from the normal line.'],
[3,'A moving object keeps constant velocity unless…','A net force acts on it','It gets tired','It becomes lighter','Time passes','This is Newton\'s first law (inertia). Friction is a force that usually slows real objects.'],
[3,'The same push acts on a light cart and a heavy cart. Which accelerates more?','The light cart','The heavy cart','Both equally','Neither','F = m × a, so for the same force a smaller mass gives a larger acceleration.'],
[2,'About how fast does light travel in a vacuum?','300,000 km/s','300 km/s','30,000 km/h','3,000 km/s','Light travels at roughly 300,000 kilometres per second.']]},
{id:'chem',name:'Chemistry Universe',d:'Elements, atoms, molecules and properties.',c:['#2a0f4a','#ff7ad9','#4a1d6e'],tp:['Elements','Atoms','Molecules','Properties'],q:[
[0,'What is the chemical symbol for gold?','Au','Ag','Go','Gd','Au comes from the Latin aurum. Ag is silver.'],
[1,'Which particle carries a positive charge?','Proton','Electron','Neutron','Photon','Protons are positive, electrons negative, neutrons neutral.'],
[2,'What is the formula of water?','H2O','HO2','H2O2','OH','Two hydrogen atoms bond with one oxygen atom. H2O2 is hydrogen peroxide.'],
[3,'Which gas is a noble gas that rarely reacts?','Helium','Oxygen','Chlorine','Hydrogen','Noble gases have full outer electron shells, so they seldom react.'],
[0,'Which element has the symbol Na?','Sodium','Nitrogen','Neon','Nickel','Na comes from the Latin natrium. Nitrogen is N.'],
[1,'The atomic number equals the number of…','Protons','Neutrons','Electrons plus neutrons','Molecules','The proton count defines the element; carbon always has 6.'],
[2,'How many atoms are in one molecule of CO2?','3','2','4','1','One carbon plus two oxygen atoms makes three atoms.'],
[3,'Which metal is liquid at room temperature?','Mercury','Iron','Copper','Aluminium','Mercury melts at about −39 °C.'],
[1,'Where are electrons found in an atom?','In shells around the nucleus','Inside the nucleus','Only in neutrons','Outside the atom','Electrons occupy energy levels around the nucleus, which holds protons and neutrons.'],
[0,'Which symbol and name match?','Fe — iron','K — calcium','Cl — carbon','Pb — platinum','Fe is iron (Latin ferrum). K is potassium, Cl chlorine and Pb lead.']]},
{id:'bio',name:'Biology Forest',d:'Cells, photosynthesis, the body and ecosystems.',c:['#0b3a2a','#7dff8a','#145a3a'],tp:['Cells','Photosynthesis','Human body','Ecosystems'],q:[
[0,'Which structure is in plant cells but not animal cells?','Cell wall','Nucleus','Cell membrane','Mitochondria','Plant cells have a rigid cell wall outside the membrane.'],
[1,'Plants make food by…','Photosynthesis','Respiration only','Digestion','Fermentation','Photosynthesis turns light energy into chemical energy stored in sugar.'],
[2,'Which organ pumps blood around the body?','Heart','Lungs','Liver','Stomach','The heart pumps blood through the circulatory system.'],
[3,'In a food chain, producers are usually…','Plants','Predators','Decomposers','Herbivores','Plants make their own food and start most food chains.'],
[0,'Which part of a plant cell carries out photosynthesis?','Chloroplast','Nucleus','Vacuole','Ribosome','Chloroplasts contain green chlorophyll that captures light.'],
[1,'Which gas do plants take in for photosynthesis?','Carbon dioxide','Oxygen','Nitrogen','Methane','Plants use CO2 and water to make glucose, releasing oxygen.'],
[2,'Which body system includes the lungs?','Respiratory system','Digestive system','Nervous system','Skeletal system','The respiratory system brings in oxygen and removes carbon dioxide.'],
[3,'What do decomposers such as fungi do?','Break down dead matter and recycle nutrients','Make food from sunlight','Hunt other animals','Pump water','They return nutrients to the soil so producers can use them again.'],
[0,'Which structure holds the cell\'s DNA and directs its activities?','Nucleus','Cell wall','Chloroplast','Vacuole','The nucleus stores DNA that directs the cell.'],
[3,'If a top predator disappears, what often happens?','Its prey can overpopulate and upset the ecosystem','Nothing changes','Plants stop growing at once','All animals leave','Food webs are linked, so removing one species can unbalance others.']]}
];
/* ---------- Save ---------- */
const K='scienceQuestV1';let S,G=null,R=null,V=null,scr='menu',keys={};
function load(fresh){try{S=fresh?null:JSON.parse(localStorage.getItem(K))}catch(e){S=null}S=S||{};
 S.code=S.code||'P'+Math.random().toString(36).slice(2,6).toUpperCase();
 for(const k of['xp','score','cr','ok','bad','time'])S[k]=S[k]||0;
 S.w=S.w||{};S.t=S.t||{};S.b=S.b||{};S.lb=S.lb||[];S.res=S.res||[];S.lv=S.lv||[];S.bt=S.bt||{};S.pl=S.pl||[];S.sp=S.sp||0;S.sk=S.sk||{classic:1};S.skin=S.skin||'classic';S.set=S.set||{snd:1,mus:1}}
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
load();
const lvl=()=>1+Math.floor(S.xp/200),unl=i=>i==0||!!(S.w[W[i-1].id]||{}).done;
/* ---------- Audio (Web Audio, generated) ---------- */
let ac;function initAudio(){if(!ac){try{ac=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(ac&&ac.state==='suspended')ac.resume()}
function tone(f,d,ty,v,f2){if(!ac||!S.set.snd)return;try{const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime;o.type=ty||'sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.linearRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v||.07,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(ac.destination);o.start();o.stop(t+d)}catch(e){}}
const NT=[262,294,330,392,440,523];let ni=2;
setInterval(()=>{if(S.set.mus&&ac){ni=Math.max(0,Math.min(5,ni+Math.floor(Math.random()*3)-1));tone(NT[ni],.4,'triangle',.025)}},450);
const good=()=>{tone(660,.12);setTimeout(()=>tone(990,.2),110)},bad=()=>tone(180,.3,'sawtooth',.06,110);
/* ---------- UI helpers ---------- */
let tt;function toast(t){const e=$('#toast');e.textContent=t;e.className='on';clearTimeout(tt);tt=setTimeout(()=>e.className='',2200)}
function show(id){scr=id;document.querySelectorAll('.scr').forEach(e=>e.classList.toggle('on',e.id===id));({menu:rMenu,worlds:rWorlds,how:rHow,ach:rAch,stats:rStats,res:rRes,set:rSet,vic:rVic,cre:rCre,shop:rShop,rm:rRoom}[id]||(()=>{}))()}
const back='<button data-a="menu">← Menu</button>';
function rMenu(){const g='⚛⚡🧲🧪🌿🔬⚗☄'.match(/./gu).map((c,i)=>`<span class="fl" style="left:${i*12+3}%;animation-delay:${-i*1.4}s">${c}</span>`).join('');
 $('#menu').innerHTML=`${g}<div class="prof">👤 ${S.code} · Lv ${lvl()} · ${S.xp} XP · 💎 ${S.cr-S.sp}</div><canvas id="mc" width="36" height="50"></canvas><h1>SCIENCE<br>QUEST</h1><p class="sub">Journey into the World of Science</p><div class="mb"><button class="pri" data-a="play">Play</button><button data-a="worlds">Worlds</button><button data-a="cre">Creator</button><button data-a="shop">Skins</button><button data-a="rm">Rooms</button></div><div class="ft"><button data-a="how">How to play</button><button data-a="ach">Achievements</button><button data-a="stats">Statistics</button><button data-a="res">Research</button><button data-a="set">Settings</button></div>`}
function rWorlds(){$('#worlds').innerHTML=`<h2>Select World</h2>`+W.map((w,i)=>{const o=S.w[w.id]||{},u=unl(i);return`<div class="wc" style="--c:${w.c[1]}"><div><h2 style="margin:0">${w.name}</h2><p>${w.d}</p><p>${u?(o.done?'✔ Completed · best time '+fmt(S.bt['w:'+w.id]):'Ready to explore'):'🔒 Finish the previous world to unlock'}</p></div><button class="pri" data-a="start" data-v="${i}" ${u?'':'disabled'}>${o.done?'Replay':'Start'}</button></div>`}).join('')+`<h2 style='margin-top:18px'>Friends' levels</h2>`+(S.pl.map((l,i)=>`<div class='wc'><div><b>${l.n}</b><p>${l.bt?'Record: '+fmt(l.bt)+' · ':''}Your best: ${fmt(S.bt['c:'+l.id])}</p></div><div class='row'><button class='pri' data-a='pplay' data-v='${i}'>Play</button><button data-a='pdel' data-v='${i}' aria-label='Remove'>✕</button></div></div>`).join('')||'<p>None yet. Import a level file or code from a friend.</p>')+`<div class='row'><button data-a='pick'>Import file</button><input type='file' id='cf' accept='.txt' hidden><input id='pc' placeholder='or paste a code'><button data-a='ppaste'>Add</button></div>`+back}
function rHow(){$('#how').innerHTML=`<h2>How to Play</h2><div class="card"><ul><li><b>Move:</b> A / D or ← →</li><li><b>Jump:</b> Space, W or ↑</li><li><b>Interact:</b> E (stand next to a terminal or the exit)</li><li><b>Pause:</b> Esc or P</li><li>On phones and tablets use the on-screen buttons.</li></ul><p>Collect crystals, avoid pink spikes and pits (you restart at the last checkpoint flag), and activate all 5 science terminals. Each terminal asks 2 questions. Hints (3 per level) remove two wrong answers. When all terminals glow green, the exit door opens.</p><p>Wrong answers still earn a little XP because reading the explanation is learning.</p></div>${back}`}
const BD=[['first','🔹','First Crystal','Collect a crystal',()=>S.cr>=1],['hoard','💎','Crystal Hoarder','Collect 25 crystals in total',()=>S.cr>=25],['sch','📘','Scholar','Answer 10 questions correctly',()=>S.ok>=10],['cur','💡','Curious Mind','Use a hint',()=>S.hint],['phys','⚡','Physicist','Finish Physics Laboratory',()=>(S.w.phys||{}).done],['chem','🧪','Chemist','Finish Chemistry Universe',()=>(S.w.chem||{}).done],['bio','🌿','Biologist','Finish Biology Forest',()=>(S.w.bio||{}).done],['perf','🎯','Flawless','Finish a world with no wrong answers',()=>Object.values(S.w).some(x=>x.perfect)],['mas','🏆','Science Master','Finish all three worlds',()=>W.every(w=>(S.w[w.id]||{}).done)],['col','🎨','Collector','Own 5 skins',()=>Object.keys(S.sk).length>=5],['leg','🌟','Legendary','Unlock a legendary skin',()=>SK.some(k=>k.r==3&&S.sk[k.id])]];
function bd(){for(const b of BD)if(!S.b[b[0]]&&b[4]()){S.b[b[0]]=1;toast('Badge unlocked: '+b[2]);save()}}
