<body>
<div id="app" class="app"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
(() => {
const STORAGE_KEY = 'scienceQuestSave_v1';
const WORLDS = [
 {id:'physics',name:'Physics Laboratory',subtitle:'Power up the laws of motion.',icon:'⚡',color:'#59dfe3',accent:'#68bbff',description:'Build a circuit, explore magnetism, and discover how forces shape the world.',mission:'Collect the power cell, solve the circuit challenge, then reach the exit.',environment:'lab',topics:['Electricity','Magnets','Light & reflection','Force & motion']},
 {id:'chemistry',name:'Chemistry Universe',subtitle:'Tiny atoms. Big discoveries.',icon:'⚗️',color:'#b5a0ff',accent:'#ffbc78',description:'Meet the elements, explore atoms, and assemble the building blocks of matter.',mission:'Scan the element station and identify the correct symbol to open the portal.',environment:'space',topics:['Elements & symbols','Atomic structure','Molecules','Properties of matter']},
 {id:'biology',name:'Biology Forest',subtitle:'Every living thing is connected.',icon:'🌿',color:'#91e9a9',accent:'#ffe27e',description:'Explore cells, photosynthesis, body systems, and the balance of ecosystems.',mission:'Restore the forest by identifying a plant-cell structure at the life scanner.',environment:'forest',topics:['Plant cells','Photosynthesis','Body systems','Ecosystems']}
];
const QUIZZES = {
physics:[
 {q:'Which part of a simple circuit provides electrical energy?',opts:['Battery','Switch','Bulb','Insulating wire'],a:0,topic:'Electricity',ex:'A battery stores chemical energy and transfers energy to charges in a circuit. A closed conducting path lets current flow.',hint:'It is the component that stores energy.'},
 {q:'What must be true for a simple bulb circuit to light?',opts:['The circuit has a gap','The circuit forms a closed path','The wires are made of plastic','The battery is removed'],a:1,topic:'Electricity',ex:'A complete, closed conducting path allows current to flow through the bulb. A break opens the circuit.',hint:'Think about whether current has a complete path.'},
 {q:'Which object is most strongly attracted to an ordinary bar magnet?',opts:['Wooden ruler','Iron nail','Glass marble','Rubber band'],a:1,topic:'Magnets',ex:'Iron is ferromagnetic and is strongly attracted to a magnet. Wood, glass, and rubber are not attracted in this way.',hint:'Choose the material used in many steel tools.'},
 {q:'What happens when two north poles of magnets are brought together?',opts:['They attract','They repel','They become non-magnetic','They always melt'],a:1,topic:'Magnets',ex:'Like magnetic poles repel; opposite poles attract.',hint:'Remember: like poles do the same thing to each other.'},
 {q:'A ray of light hits a flat mirror. What is the angle of reflection measured from?',opts:['The mirror surface','The normal to the surface','The room floor','The reflected ray itself'],a:1,topic:'Light & reflection',ex:'The angle of reflection is measured from the normal, an imaginary line perpendicular to the surface, and equals the angle of incidence.',hint:'It is measured from a line perpendicular to the mirror.'},
 {q:'Why can you see your image in a smooth mirror?',opts:['It creates new light','It reflects light in an orderly way','It absorbs every ray','It bends sound waves'],a:1,topic:'Light & reflection',ex:'A smooth surface produces specular reflection, allowing reflected rays to form a recognizable image.',hint:'The mirror sends light back toward your eyes.'},
 {q:'A force is best described as…',opts:['A push or a pull','A type of energy only','The amount of space occupied','A color of light'],a:0,topic:'Force & motion',ex:'A force is a push or pull. Forces can change an object’s motion or shape.',hint:'You use one when pushing a door.'},
 {q:'If the same net force acts on two objects, which has the greater acceleration?',opts:['The object with more mass','The object with less mass','Both always have zero acceleration','Mass never matters'],a:1,topic:'Force & motion',ex:'Newton’s second law is F = ma. For the same net force, a smaller mass has a greater acceleration.',hint:'Use a = F ÷ m.'},
 {q:'What is friction?',opts:['A force that resists relative motion between surfaces','A kind of magnet','Light travelling through glass','A unit of electric current'],a:0,topic:'Force & motion',ex:'Friction acts between surfaces in contact and opposes their relative sliding or tendency to slide.',hint:'It helps shoes grip the floor but can slow a moving object.'},
 {q:'Which change would usually increase the kinetic energy of a moving object?',opts:['Reducing its speed','Increasing its speed','Painting it blue','Turning off a nearby lamp'],a:1,topic:'Force & motion',ex:'Kinetic energy depends on speed: KE = ½mv². At the same mass, a faster object has more kinetic energy.',hint:'Kinetic energy is energy of motion.'}
 ],
 chemistry:[
 {q:'What does the chemical symbol O represent?',opts:['Gold','Oxygen','Osmium only in every context','Hydrogen'],a:1,topic:'Elements & symbols',ex:'O is the symbol for the element oxygen. Symbols are standardized abbreviations for elements.',hint:'It is a gas that makes up about one-fifth of Earth’s atmosphere.'},
 {q:'Which symbol belongs to sodium?',opts:['S','So','Na','N'],a:2,topic:'Elements & symbols',ex:'Sodium’s symbol is Na, from the Latin name natrium. Symbols may come from historical names.',hint:'Its symbol comes from the Latin name natrium.'},
 {q:'Which subatomic particle has a positive electric charge?',opts:['Electron','Neutron','Proton','Photon'],a:2,topic:'Atomic structure',ex:'Protons have a positive charge, electrons a negative charge, and neutrons no electric charge.',hint:'It is located in the atomic nucleus with neutrons.'},
 {q:'Where are protons and neutrons found in an atom?',opts:['In the nucleus','In the electron cloud only','Outside the atom','Inside every electron'],a:0,topic:'Atomic structure',ex:'The nucleus contains protons and, in most atoms, neutrons. Electrons occupy regions around the nucleus.',hint:'It is the dense central region of an atom.'},
 {q:'What does the formula H₂O tell us about one water molecule?',opts:['Two oxygen atoms and one hydrogen atom','Two hydrogen atoms and one oxygen atom','Three oxygen atoms','Only hydrogen atoms'],a:1,topic:'Molecules',ex:'The subscript 2 applies to hydrogen: one water molecule has two hydrogen atoms and one oxygen atom.',hint:'A subscript tells how many atoms of that element are present.'},
 {q:'Which statement about a molecule of oxygen gas, O₂, is correct?',opts:['It contains two oxygen atoms bonded together','It contains two different elements','It contains two protons only','It is a single oxygen atom'],a:0,topic:'Molecules',ex:'O₂ is a molecule made of two bonded oxygen atoms. A molecule can contain atoms of the same element or different elements.',hint:'The subscript 2 applies to oxygen.'},
 {q:'Which is an example of a chemical element?',opts:['Pure copper','Salt water','Air','Sugar solution'],a:0,topic:'Elements & symbols',ex:'Copper is an element consisting of copper atoms. Salt water, air, and sugar solution are mixtures.',hint:'An element contains one kind of atom.'},
 {q:'Which method can separate sand from water?',opts:['Filtration','Changing sand into oxygen','Using a magnet for all sand','Nuclear fusion'],a:0,topic:'Properties of matter',ex:'Filtration traps an insoluble solid such as sand while water passes through the filter.',hint:'A filter lets liquid through but holds back solid particles.'},
 {q:'In a neutral atom, the number of electrons equals the number of…',opts:['Neutrons always','Protons','Molecules nearby','Shells'],a:1,topic:'Atomic structure',ex:'A neutral atom has equal numbers of positive protons and negative electrons, so the charges balance.',hint:'Positive and negative charges must balance.'},
 {q:'During an ordinary chemical reaction, atoms are generally…',opts:['Created from nothing','Destroyed completely','Rearranged into new combinations','Changed into different elements in every reaction'],a:2,topic:'Molecules',ex:'Chemical reactions rearrange atoms as bonds break and form. Ordinary chemical reactions do not turn one element into another.',hint:'Atoms change partners; they do not simply disappear.'}
 ],
 biology:[
 {q:'Which structure is found in plant cells and helps support the cell?',opts:['Cell wall','Lung','Spinal cord','Red blood cell'],a:0,topic:'Plant cells',ex:'A plant cell wall, made mainly of cellulose, provides support and protection outside the cell membrane.',hint:'It is a rigid outer layer outside the cell membrane.'},
 {q:'Which organelle carries out photosynthesis in most plant cells?',opts:['Mitochondrion','Chloroplast','Nucleus','Ribosome'],a:1,topic:'Plant cells',ex:'Chloroplasts contain chlorophyll and are where photosynthesis takes place in plants and many algae.',hint:'It contains green chlorophyll.'},
 {q:'Which ingredients are used by plants in photosynthesis?',opts:['Carbon dioxide and water, using light energy','Oxygen and sugar only','Nitrogen and salt only','Protein and soil'],a:0,topic:'Photosynthesis',ex:'In photosynthesis, light energy helps convert carbon dioxide and water into sugars, releasing oxygen.',hint:'Plants take in a gas from air and water from their surroundings.'},
 {q:'What is one major role of roots in many plants?',opts:['Absorb water and minerals','Make sound waves','Pump blood','Capture prey in every plant'],a:0,topic:'Plant cells',ex:'Roots anchor many plants and absorb water and dissolved mineral nutrients from the soil.',hint:'They are usually below the ground.'},
 {q:'Which body system moves blood around the human body?',opts:['Digestive system','Circulatory system','Skeletal system','Nervous system only'],a:1,topic:'Body systems',ex:'The circulatory system includes the heart, blood, and blood vessels and transports oxygen, nutrients, and other substances.',hint:'It includes the heart and blood vessels.'},
 {q:'What is the main function of the lungs?',opts:['Exchange oxygen and carbon dioxide','Digest proteins','Make bones move','Filter light'],a:0,topic:'Body systems',ex:'The lungs are part of the respiratory system. Gas exchange transfers oxygen into the blood and carbon dioxide out.',hint:'They are the main organs used for breathing.'},
 {q:'What is an ecosystem?',opts:['Only one animal','Organisms interacting with each other and their physical environment','A single cell under a microscope','A list of chemical symbols'],a:1,topic:'Ecosystems',ex:'An ecosystem includes the living community and non-living environmental factors interacting in an area.',hint:'It includes living things and non-living surroundings.'},
 {q:'In a simple food chain, what is a producer?',opts:['An organism that makes its own food, often using sunlight','An animal that only eats meat','A decomposer only','A rock that stores heat'],a:0,topic:'Ecosystems',ex:'Plants and algae are common producers because photosynthesis lets them make organic food using light energy.',hint:'Green plants are a familiar example.'},
 {q:'Which organisms help break down dead material and return nutrients to ecosystems?',opts:['Decomposers such as fungi and many bacteria','Only top predators','Clouds','Only flowering plants'],a:0,topic:'Ecosystems',ex:'Decomposers, including many fungi and bacteria, break down dead organisms and waste, recycling nutrients.',hint:'Fungi and many bacteria play this role.'},
 {q:'Which organ is part of the nervous system and helps process information?',opts:['Brain','Stomach lining only','Femur','Leaf'],a:0,topic:'Body systems',ex:'The brain is a central organ of the nervous system; it processes information and helps coordinate many body functions.',hint:'It is protected by the skull.'}
 ]
};
const CHALLENGES = {
 physics:{title:'Complete the circuit',icon:'🔋',text:'The lab lamp is dark. Which action makes a simple battery–wire–bulb circuit work?',opts:['Create a closed conducting loop','Leave one wire disconnected','Replace all wires with rubber'],a:0,ex:'A closed conducting loop lets electric current flow through the bulb. You connected the circuit!'},
 chemistry:{title:'Assemble a water molecule',icon:'⚗️',text:'The molecule bench needs one water molecule. Which atom combination builds H₂O?',opts:['Two hydrogen atoms and one oxygen atom','Two oxygen atoms and one hydrogen atom','One hydrogen atom and one oxygen atom'],a:0,ex:'H₂O contains two hydrogen atoms and one oxygen atom. The subscript 2 applies to hydrogen, so the guided molecule is assembled correctly.'},
 biology:{title:'Restore the life scanner',icon:'🌱',text:'Which plant-cell structure captures light energy for photosynthesis?',opts:['Chloroplast','Cell wall','Nucleus only'],a:0,ex:'Chloroplasts contain chlorophyll and capture light energy used in photosynthesis.'}
};
const ACHIEVEMENTS = [
 {id:'first_steps',icon:'👣',name:'First Steps',desc:'Finish your first science world.'},
 {id:'crystal_5',icon:'💎',name:'Crystal Curious',desc:'Collect 5 science crystals.'},
 {id:'crystal_15',icon:'✨',name:'Crystal Collector',desc:'Collect 15 science crystals.'},
 {id:'physics',icon:'⚡',name:'Circuit Solver',desc:'Complete the Physics Laboratory.'},
 {id:'chemistry',icon:'⚗️',name:'Element Explorer',desc:'Complete the Chemistry Universe.'},
 {id:'biology',icon:'🌿',name:'Forest Guardian',desc:'Complete the Biology Forest.'},
 {id:'perfect_quiz',icon:'🎯',name:'Sharp Mind',desc:'Answer every question in a 5-question checkpoint correctly.'},
 {id:'quiz_10',icon:'🧠',name:'Knowledge Seeker',desc:'Complete a 10-question world quiz.'},
 {id:'research',icon:'🔬',name:'Research Pioneer',desc:'Complete a pre-test / post-test study run.'},
 {id:'all_worlds',icon:'🏆',name:'Science Quest Hero',desc:'Complete all three worlds.'}
];
const DEFAULT_SAVE = {xp:0,score:0,crystals:0,completedWorlds:[],unlockedWorlds:['physics'],achievements:[],worldScores:{},quizStats:{correct:0,incorrect:0,tests:0},topicStats:{},leaderboard:[],researchRecords:[],settings:{sound:true,music:false,reducedMotion:false},lastWorld:'physics'};
function loadSave(){try{const raw=localStorage.getItem(STORAGE_KEY);if(!raw)return structuredClone(DEFAULT_SAVE);const parsed=JSON.parse(raw);return {...structuredClone(DEFAULT_SAVE),...parsed,settings:{...DEFAULT_SAVE.settings,...(parsed.settings||{})}}}catch(e){return structuredClone(DEFAULT_SAVE)}}
let save=loadSave();
function persist(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(save))}catch(e){console.warn('Local save unavailable',e)}}
const $ = (sel,root=document)=>root.querySelector(sel);
const app=$('#app');
let screen='menu', activeWorld='physics', quizSession=null, researchRun=null, game=null, rafId=0, lastFrame=0, toastTimer=0;
const keys=new Set(), touchKeys=new Set(), justPressed=new Set();
let audioCtx=null, musicTimer=null, musicStep=0, musicOscs=[];
function worldById(id){return WORLDS.find(w=>w.id===id)||WORLDS[0]}
function xpLevel(xp=save.xp){return Math.floor(xp/100)+1}
function xpForNext(xp=save.xp){return 100-(xp%100)}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function header(){return `<header class="topbar"><button class="brand" data-action="home" aria-label="Go to main menu"><span class="brand-mark">✦</span><span><span class="brand-title">SCIENCE QUEST</span><span class="brand-sub">Journey into the World of Science</span></span></button><div class="top-actions"><div class="score-pill"><span>✧</span><span>${save.score.toLocaleString()} <span class="muted">PTS</span></span></div><div class="profile-pill"><span class="avatar">🧑‍🔬</span><span>Explorer · Lv ${xpLevel()}</span></div><button class="icon-btn" title="Toggle sound effects" aria-label="Toggle sound effects" data-action="toggle-sound">${save.settings.sound?'🔊':'🔇'}</button><button class="icon-btn" title="Settings" aria-label="Settings" data-action="settings">⚙</button></div></header>`}
function shell(body,withHeader=true){app.innerHTML=`${withHeader?header():''}<main class="screen">${body}</main><div class="footer-note">SCIENCE QUEST · Learn by exploring, testing, and trying again.</div>`;bindActions();if(save.settings.reducedMotion)document.body.classList.add('motion-off');else document.body.classList.remove('motion-off')}
function toast(message){const t=$('#toast');t.textContent=message;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2400)}
function addXp(n){save.xp+=n;persist();refreshHeader()}
function refreshHeader(){const title=$('.score-pill');if(title)title.innerHTML=`<span>✧</span><span>${save.score.toLocaleString()} <span class="muted">PTS</span></span>`;const p=$('.profile-pill');if(p)p.innerHTML=`<span class="avatar">🧑‍🔬</span><span>Explorer · Lv ${xpLevel()}</span>`}
function grantAchievement(id){if(!save.achievements.includes(id)){save.achievements.push(id);persist();const a=ACHIEVEMENTS.find(x=>x.id===id);if(a)toast(`Achievement unlocked: ${a.name} ${a.icon}`)}}
function refreshAchievements(){if(save.completedWorlds.length)grantAchievement('first_steps');if(save.crystals>=5)grantAchievement('crystal_5');if(save.crystals>=15)grantAchievement('crystal_15');if(save.completedWorlds.includes('physics'))grantAchievement('physics');if(save.completedWorlds.includes('chemistry'))grantAchievement('chemistry');if(save.completedWorlds.includes('biology'))grantAchievement('biology');if(WORLDS.every(w=>save.completedWorlds.includes(w.id)))grantAchievement('all_worlds')}
function mainMenu(){screen='menu';stopGameLoop();const complete=save.completedWorlds.length;const hero=`<section class="hero"><div class="hero-copy"><div class="eyebrow">✦ Your next discovery starts here</div><h1>SCIENCE <span>QUEST</span></h1><p>Explore strange new worlds, solve real science challenges, and discover how the universe works — one experiment at a time.</p><div class="hero-actions"><button class="btn btn-primary" data-action="play">▶ &nbsp; Play Game <span>→</span></button><button class="btn btn-ghost" data-action="worlds">◎ &nbsp; Select World</button></div><div class="hero-meta"><span>🧪 <strong>3</strong> science worlds</span><span>💎 <strong>${save.crystals}</strong> crystals found</span><span>🏅 <strong>${save.achievements.length}</strong> achievements</span></div></div><div class="hero-art" aria-label="Cartoon scientist exploring a glowing planet"><div class="orbit"></div><div class="planet big"></div><div class="planet small"></div><div class="planet moon"></div><div class="mascot"><div class="hair"></div><div class="head"></div><div class="ear l"></div><div class="ear r"></div><div class="eye l"></div><div class="eye r"></div><div class="smile"></div><div class="coat"></div><div class="shirt"></div><div class="pocket"></div><div class="arm l"></div><div class="arm r"></div><div class="boot"></div></div><span class="spark s1">✦</span><span class="spark s2">✧</span><span class="spark s3">✦</span></div></section>`;
const worldCards=WORLDS.map(w=>{let progress=save.completedWorlds.includes(w.id)?100:(save.worldScores[w.id]?.progress||0);const locked=!save.unlockedWorlds.includes(w.id);return `<article class="world-card" style="--world-color:${w.color}"><div class="world-top"><div class="world-icon">${w.icon}</div><span class="status-tag" style="color:${locked?'#d7b87a':'#91efb0'}">${locked?'🔒 Locked':progress===100?'✓ Completed':save.lastWorld===w.id?'↗ Continue':'● Ready'}</span></div><h3>${w.name}</h3><p>${w.subtitle}</p><div class="world-foot"><div class="progress-track"><span style="width:${progress}%"></span></div><small>${progress}%</small></div></article>`}).join('');
shell(`${hero}<div class="menu-tools"><button class="btn btn-ghost" data-action="howto">⌨ How to Play</button><button class="btn btn-ghost" data-action="achievements">🏅 Achievements</button><button class="btn btn-ghost" data-action="stats">◫ Player Statistics</button><button class="btn btn-ghost" data-action="research">🔬 Research Mode</button><button class="btn btn-ghost" data-action="settings">⚙ Settings</button></div><div class="section-head"><div><div class="eyebrow">Choose your expedition</div><h2>Three worlds. One curious mind.</h2></div><button class="back-btn" data-action="worlds">All worlds ↗</button></div><div class="world-grid">${worldCards}</div><div class="feature-grid"><article class="feature-card"><span class="feature-icon">🧠</span><div><h3>Test what you learn</h3><p>Short science checkpoints, instant explanations, and a report that shows the topics to revisit.</p></div></article><article class="feature-card"><span class="feature-icon">🔬</span><div><h3>Research Mode</h3><p>Compare anonymous pre-test and post-test results, then export a CSV for your science fair analysis.</p></div></article><article class="feature-card"><span class="feature-icon">🏆</span><div><h3>Earn discoveries</h3><p>Collect crystals, build XP, unlock badges, and save your progress on this device.</p></div></article></div>`,true)}
function worldsScreen(){screen='worlds';stopGameLoop();const cards=WORLDS.map((w,i)=>{const unlocked=save.unlockedWorlds.includes(w.id);const done=save.completedWorlds.includes(w.id);const st=save.worldScores[w.id]||{};return `<article class="world-card" style="--world-color:${w.color};min-height:300px"><div class="world-top"><div class="world-icon">${w.icon}</div><span class="status-tag" style="color:${unlocked?'#8df0b0':'#e9ca87'}">${done?'✓ Complete':unlocked?'● Unlocked':'🔒 Unlock previous world'}</span></div><h3>${w.name}</h3><p>${w.description}</p><div style="display:flex;gap:8px;flex-wrap:wrap;margin:2px 0 16px">${w.topics.map(t=>`<span style="font-size:.7rem;border-radius:50px;padding:5px 8px;background:#1b3853;color:#b7cce1">${t}</span>`).join('')}</div><div class="world-foot"><small>Best quiz: ${st.bestQuiz==null?'—':st.bestQuiz+'/10'}</small><div class="world-actions"><button class="btn btn-small btn-ghost" data-action="practice-quiz" data-world="${w.id}">10-question quiz</button><button class="btn btn-small ${unlocked?'btn-primary':'btn-ghost'}" data-action="enter-world" data-world="${w.id}" ${unlocked?'':'disabled'}>${done?'Play Again':'Enter World'} →</button></div></div></article>`}).join('');shell(`<div class="page-head"><div><div class="eyebrow">Expedition map</div><h1>Select your world</h1><p>Each world begins with a short knowledge checkpoint. Explore the level, solve its science mission, and then take the final checkpoint.</p></div><button class="back-btn" data-action="home">← Main menu</button></div><div class="world-grid">${cards}</div><div class="callout" style="margin-top:18px"><strong>Unlock path:</strong> finish a world mission to unlock the next one. Research Mode can select any world independently for a controlled demo session.</div>`,true)}
function howToScreen(){screen='howto';stopGameLoop();shell(`<div class="page-head"><div><div class="eyebrow">Field manual</div><h1>How to play</h1><p>Explore carefully. Test ideas. Science rewards curiosity more than speed.</p></div><button class="back-btn" data-action="home">← Main menu</button></div><div class="content-grid"><section class="panel-card"><h2>🎮 Controls</h2><div class="setting-row"><div><strong>Move left / right</strong><small>Navigate platforms and reach floating crystals.</small></div><div><span class="keycap">A</span><span class="keycap">D</span><span class="muted">or</span><span class="keycap">←</span><span class="keycap">→</span></div></div><div class="setting-row"><div><strong>Jump</strong><small>Jump across small gaps and reach higher platforms.</small></div><span class="keycap">SPACE</span></div><div class="setting-row"><div><strong>Interact</strong><small>Collect a mission item, activate a scanner, or use a checkpoint.</small></div><span class="keycap">E</span></div><div class="setting-row"><div><strong>Pause / resume</strong><small>Stop the action without losing progress.</small></div><span class="keycap">ESC</span></div></section><section class="panel-card"><h2>🧪 Your mission loop</h2><ol class="tip-list"><li>Answer five warm-up questions. Hints are limited, so use them when you need a nudge.</li><li>Explore the platform level. Crystals grant points and XP; checkpoints save your return position.</li><li>Use <strong>E</strong> near glowing science stations to solve the world-specific challenge.</li><li>Reach the portal after completing the mission, then take the comparable final checkpoint.</li><li>Review your topic report to see where you were confident and what to study next.</li></ol></section></div><div class="callout" style="margin-top:16px"><strong>Mobile:</strong> use the left/right arrows and jump button shown below the game canvas. Your progress is stored locally in this browser.</div><div style="margin-top:20px"><button class="btn btn-primary" data-action="play">Start exploring →</button></div>`,true)}
function achievementsScreen(){screen='achievements';stopGameLoop();const cards=ACHIEVEMENTS.map(a=>{const got=save.achievements.includes(a.id);return `<article class="badge-card ${got?'':'locked'}"><div class="badge-art">${got?a.icon:'🔒'}</div><h3>${a.name}</h3><p>${got?a.desc:'Not yet unlocked'}${got?'<br><strong style="color:#9df4c2">Unlocked</strong>':''}</p></article>`}).join('');shell(`<div class="page-head"><div><div class="eyebrow">Your collection</div><h1>Achievements</h1><p>Badges recognize exploring, collecting, solving, and learning — not just finishing quickly.</p></div><button class="back-btn" data-action="home">← Main menu</button></div><div class="stat-grid" style="margin-bottom:20px"><div class="stat-box"><div class="stat-label">Badges unlocked</div><div class="stat-value">${save.achievements.length}<span class="muted" style="font-size:1rem">/${ACHIEVEMENTS.length}</span></div></div><div class="stat-box"><div class="stat-label">Explorer level</div><div class="stat-value">${xpLevel()}</div></div><div class="stat-box"><div class="stat-label">Total XP</div><div class="stat-value">${save.xp}</div></div><div class="stat-box"><div class="stat-label">Worlds completed</div><div class="stat-value">${save.completedWorlds.length}/3</div></div></div><div class="badge-grid">${cards}</div>`,true)}
function statsScreen(){screen='stats';stopGameLoop();const tp=save.topicStats||{};const topics=Object.entries(tp).sort((a,b)=>(a[1].correct/(a[1].correct+a[1].incorrect||1))-(b[1].correct/(b[1].correct+b[1].incorrect||1)));const weak=topics.filter(([k,v])=>v.incorrect>0).slice(0,3);const report=topics.length?`<div class="chart-bars">${topics.map(([name,v])=>{const total=v.correct+v.incorrect;const pct=total?Math.round(v.correct/total*100):0;return `<div class="bar-row"><span>${esc(name)}</span><div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div><strong>${pct}%</strong></div>`}).join('')}</div>`:'<div class="empty-state">Complete a knowledge checkpoint to start building your topic report.</div>';const rows=[...save.leaderboard].sort((a,b)=>b.score-a.score).slice(0,8);shell(`<div class="page-head"><div><div class="eyebrow">Explorer analytics</div><h1>Player statistics</h1><p>Your local learning activity, quiz accuracy, saved level scores, and suggested review topics.</p></div><button class="back-btn" data-action="home">← Main menu</button></div><div class="stat-grid"><div class="stat-box"><div class="stat-label">Total points</div><div class="stat-value">${save.score.toLocaleString()}</div><div class="stat-foot">Across all adventures</div></div><div class="stat-box"><div class="stat-label">XP / Level</div><div class="stat-value">${save.xp} <span class="muted" style="font-size:1rem">/ Lv ${xpLevel()}</span></div><div class="progress-track" style="margin-top:10px"><span style="width:${save.xp%100}%"></span></div></div><div class="stat-box"><div class="stat-label">Quiz accuracy</div><div class="stat-value">${save.quizStats.correct+save.quizStats.incorrect?Math.round(save.quizStats.correct/(save.quizStats.correct+save.quizStats.incorrect)*100):0}%</div><div class="stat-foot">${save.quizStats.correct} correct · ${save.quizStats.incorrect} incorrect</div></div><div class="stat-box"><div class="stat-label">Crystals</div><div class="stat-value">💎 ${save.crystals}</div><div class="stat-foot">Curiosity collected</div></div></div><div class="content-grid" style="margin-top:17px"><section class="panel-card"><h2>Performance by topic</h2><p>Accuracy is calculated from answered quiz questions saved on this device.</p>${report}</section><section class="panel-card"><h2>Suggested review</h2>${weak.length?`<p>Revisit these topics, then retry a quiz to check your understanding.</p><ul class="tip-list">${weak.map(([name,v])=>`<li><strong>${esc(name)}</strong> — ${v.incorrect} incorrect answer${v.incorrect===1?'':'s'} recorded. Review the explanation for each question.</li>`).join('')}</ul>`:'<p>Not enough topic data to make a review suggestion yet. Complete a quiz and missed topics will appear here.</p>'}<button class="btn btn-ghost full" data-action="worlds">Practice a world quiz →</button></section></div><section class="panel-card" style="margin-top:17px"><div class="section-head" style="margin:0 0 10px"><div><h2>Local leaderboard</h2><p>Scores saved only in this browser. No online ranking or account is used.</p></div></div>${rows.length?`<div class="table-wrap"><table class="data-table"><thead><tr><th>Rank</th><th>World</th><th>Score</th><th>Recorded</th></tr></thead><tbody>${rows.map((r,i)=>`<tr><td>${i+1}</td><td>${esc(worldById(r.world).name)}</td><td>${r.score}</td><td>${new Date(r.date).toLocaleDateString()}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty-state">Finish a world to record your first local score.</div>'}</section>`,true)}
function settingsScreen(){screen='settings';stopGameLoop();shell(`<div class="page-head"><div><div class="eyebrow">Personalize your adventure</div><h1>Settings</h1><p>Audio is generated locally with Web Audio; no media downloads are needed.</p></div><button class="back-btn" data-action="home">← Main menu</button></div><div class="content-grid"><section class="panel-card"><h2>Game preferences</h2><div class="setting-row"><div><strong>Sound effects</strong><small>Jump, collect, feedback, and mission sounds.</small></div><input class="toggle" type="checkbox" data-setting="sound" ${save.settings.sound?'checked':''}/></div><div class="setting-row"><div><strong>Background music</strong><small>Soft synthesized tones, enabled after user interaction.</small></div><input class="toggle" type="checkbox" data-setting="music" ${save.settings.music?'checked':''}/></div><div class="setting-row"><div><strong>Reduce motion</strong><small>Turns off decorative animation and transitions where possible.</small></div><input class="toggle" type="checkbox" data-setting="reducedMotion" ${save.settings.reducedMotion?'checked':''}/></div></section><section class="panel-card"><h2>Save data</h2><p>Scores, world progress, achievements, settings, and anonymous research records are saved to localStorage in this browser.</p><div class="callout warn"><strong>Reset is permanent for this browser.</strong> Export research records before clearing data if you need to keep them.</div><button class="btn btn-danger" style="margin-top:15px" data-action="reset-save">Reset all local progress</button></section></div>`,true);$('#app').querySelectorAll('[data-setting]').forEach(el=>el.addEventListener('change',()=>{save.settings[el.dataset.setting]=el.checked;if(el.dataset.setting==='music')setMusic(el.checked);persist();if(el.dataset.setting==='reducedMotion')document.body.classList.toggle('motion-off',el.checked)}))}
function researchScreen(){screen='research';stopGameLoop();const counts=save.researchRecords.length;const rows=save.researchRecords.slice(-5).reverse();shell(`<div class="page-head"><div><div class="eyebrow">Competition demonstration</div><h1>Scientific Research Mode</h1><p>Run an anonymous pre-test → play one selected level → post-test session, then export the results for analysis.</p></div><button class="back-btn" data-action="home">← Main menu</button></div><div class="content-grid"><section class="panel-card"><h2>Start a study session</h2><div class="callout"><strong>Privacy first:</strong> use a random participant code only. Do not enter names, emails, school IDs, or other identifying details. Data stays in this browser until you export it.</div><div class="field"><label for="participantCode">Anonymous participant code</label><input id="participantCode" class="text-input" maxlength="32" placeholder="e.g. P-07 or leave blank to generate one" autocomplete="off" /></div><div class="field"><label for="researchWorld">Science world</label><select id="researchWorld" class="select-input">${WORLDS.map(w=>`<option value="${w.id}">${w.name}</option>`).join('')}</select></div><button class="btn btn-primary full" data-action="research-start">Begin pre-test →</button><p style="font-size:.8rem;margin-bottom:0">Pre-test and post-test use matched-length, parallel question sets from the same world (5 questions each). Hints are disabled for research assessments.</p></section><section class="panel-card"><h2>Research protocol</h2><ol class="tip-list"><li>Use a random participant code and select a world.</li><li>Complete the 5-question initial test.</li><li>Play the selected world and complete its mission.</li><li>Complete the 5-question final test; scores and elapsed time are recorded.</li><li>Export the CSV and analyze the collected data with an appropriate design.</li></ol><div class="callout warn"><strong>Interpretation note:</strong> a pre-test/post-test comparison alone does not establish causation. Practice effects, prior knowledge, selection, and other factors can influence scores. Research conclusions need actual collected data and an appropriate study design.</div></section></div><section class="panel-card" style="margin-top:17px"><div class="section-head" style="margin:0 0 12px"><div><h2>Saved anonymous sessions</h2><p>${counts} session${counts===1?'':'s'} saved locally.</p></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-small btn-ghost" data-action="export-csv" ${counts?'':'disabled'}>⇩ Export CSV</button><button class="btn btn-small btn-ghost" data-action="clear-research" ${counts?'':'disabled'}>Clear research data</button></div></div>${rows.length?`<div class="table-wrap"><table class="data-table"><thead><tr><th>Code</th><th>World</th><th>Pre-test</th><th>Post-test</th><th>Change</th><th>Date</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.code)}</td><td>${esc(worldById(r.world).name)}</td><td>${r.preCorrect}/${r.total} (${r.prePct}%)</td><td>${r.postCorrect}/${r.total} (${r.postPct}%)</td><td class="${r.ppChange>=0?'delta-positive':'delta-negative'}">${r.ppChange>0?'+':''}${r.ppChange} pp</td><td>${new Date(r.timestamp).toLocaleDateString()}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty-state">No research sessions yet. A completed session will appear here.</div>'}</section>`,true)}
function enterWorld(id){activeWorld=id;save.lastWorld=id;persist();startAssessment(id,'normal_pre')}
function startPracticeQuiz(id){activeWorld=id;startAssessment(id,'practice')}
function startResearch(){const input=$('#participantCode');let code=(input.value||'').trim().replace(/[^a-zA-Z0-9_-]/g,'').slice(0,32);if(!code)code='P-'+Math.random().toString(36).slice(2,7).toUpperCase();activeWorld=$('#researchWorld').value;researchRun={code,world:activeWorld,startTime:Date.now(),preCorrect:0,postCorrect:0,total:5,preResponses:[],postResponses:[]};startAssessment(activeWorld,'research_pre');}
function startAssessment(worldId,mode){activeWorld=worldId;const questions=QUIZZES[worldId];let indices;if(mode.endsWith('_pre'))indices=[0,2,4,6,8];else if(mode.endsWith('_post'))indices=[1,3,5,7,9];else indices=questions.map((_,i)=>i);quizSession={world:worldId,mode,questions:indices.map(i=>({...questions[i],originalIndex:i})),index:0,selected:null,feedback:null,correct:0,incorrect:0,hints:mode.startsWith('research')?0:2,usedHint:false,startedAt:Date.now(),responses:[]};screen='quiz';renderQuiz();}
function renderQuiz(){screen='quiz';const q=quizSession.questions[quizSession.index];const total=quizSession.questions.length;const assessmentLabel=quizSession.mode.includes('pre')?'Initial knowledge checkpoint':quizSession.mode.includes('post')?'Final knowledge checkpoint':`Practice quiz · ${worldById(activeWorld).name}`;const noHints=quizSession.mode.startsWith('research');const answers=q.opts.map((opt,i)=>{let klass='';if(quizSession.feedback){if(i===q.a)klass='correct';else if(i===quizSession.selected)klass='wrong'}const eliminated=quizSession.hintForIndex===quizSession.index&&i!==q.a;return `<button class="answer-btn ${klass}" data-answer="${i}" ${quizSession.selected!==null||eliminated?'disabled':''}><span class="answer-letter">${String.fromCharCode(65+i)}</span>${esc(opt)}</button>`}).join('');const feedback=quizSession.feedback?`<div class="feedback-box ${quizSession.selected===q.a?'good':'bad'}"><strong>${quizSession.selected===q.a?'Correct! +10 points':'Not quite — keep learning.'}</strong><div style="margin-top:4px">${esc(q.ex)}</div></div>`:'';const nextLabel=quizSession.index===total-1?(quizSession.mode==='practice'?'See quiz results':'Continue →'):'Next question →';shell(`<div class="page-head"><div><div class="eyebrow">${esc(assessmentLabel)}</div><h1>${quizSession.mode==='practice'?'Science knowledge quiz':quizSession.mode.includes('pre')?'Before your expedition':'After your expedition'}</h1><p>${esc(worldById(activeWorld).name)} · Read the explanation after each answer.</p></div><button class="back-btn" data-action="quit-quiz">✕ Exit quiz</button></div><div class="content-grid"><section class="panel-card" style="max-width:780px;width:100%;margin:0 auto;grid-column:1/-1"><div class="quiz-top"><span>QUESTION ${quizSession.index+1} OF ${total}</span><span>✦ ${quizSession.correct} correct</span></div><div class="quiz-progress"><span style="width:${(quizSession.index/total)*100}%"></span></div><div class="quiz-topic">${esc(q.topic)}</div><h2 class="quiz-question">${esc(q.q)}</h2><div class="answer-list">${answers}</div>${feedback}<div class="quiz-actions"><button class="btn btn-ghost btn-small" data-action="hint" ${quizSession.selected!==null||noHints||quizSession.hints<=0?'disabled':''}>💡 Hint (${quizSession.hints})</button>${quizSession.feedback?`<button class="btn btn-primary" data-action="quiz-next">${nextLabel}</button>`:''}</div>${quizSession.hintText?`<div class="callout" style="margin-top:12px">💡 ${esc(quizSession.hintText)}</div>`:''}</section></div>`,true)}
function answerQuestion(index){if(quizSession.selected!==null)return;const q=quizSession.questions[quizSession.index];quizSession.selected=index;quizSession.feedback=true;const correct=index===q.a;if(correct){quizSession.correct++;if(quizSession.mode==='practice'){save.score+=10;save.xp+=5;} }else quizSession.incorrect++;quizSession.responses.push({topic:q.topic,correct,question:q.q,chosen:q.opts[index],right:q.opts[q.a]});if(!quizSession.mode.startsWith('research')){save.quizStats[correct?'correct':'incorrect']++;if(!save.topicStats[q.topic])save.topicStats[q.topic]={correct:0,incorrect:0};save.topicStats[q.topic][correct?'correct':'incorrect']++;persist();}playSfx(correct?'correct':'wrong');renderQuiz()}
function useHint(){if(quizSession.selected!==null||quizSession.hints<=0||quizSession.mode.startsWith('research'))return;const q=quizSession.questions[quizSession.index];quizSession.hints--;quizSession.usedHint=true;quizSession.hintForIndex=quizSession.index;quizSession.hintText=q.hint||'Think about the key idea in this topic.';renderQuiz()}
function quizNext(){const s=quizSession;if(!s||s.selected===null)return;if(s.index<s.questions.length-1){s.index++;s.selected=null;s.feedback=null;s.hintText=null;renderQuiz();return}finishAssessment()}
function finishAssessment(){const s=quizSession;const pct=Math.round(s.correct/s.questions.length*100);if(s.questions.length===5&&s.correct===5)grantAchievement('perfect_quiz');if(s.mode==='practice'){save.quizStats.tests++;if(!save.worldScores[s.world])save.worldScores[s.world]={progress:0};save.worldScores[s.world].bestQuiz=Math.max(save.worldScores[s.world].bestQuiz??0,s.correct);persist();if(s.correct===s.questions.length)grantAchievement('perfect_quiz');grantAchievement('quiz_10');quizSession=null;quizSummary(s,pct);return}
if(s.mode==='research_pre'){researchRun.preCorrect=s.correct;researchRun.prePct=pct;researchRun.preResponses=s.responses;researchRun.preDoneAt=Date.now();quizSession=null;startGame(s.world,'research');return}
if(s.mode==='normal_pre'){const baseline={correct:s.correct,total:s.questions.length,pct,topics:s.responses.map(r=>({topic:r.topic,correct:r.correct}))};quizSession=null;startGame(s.world,'normal',baseline);return}
if(s.mode==='research_post'||s.mode==='normal_post'){const mode=s.mode;const correct=s.correct;const responses=s.responses;quizSession=null;if(mode==='research_post'){researchRun.postCorrect=correct;researchRun.postPct=pct;researchRun.postResponses=responses;saveResearchRecord();}else if(game&&game.baseline){game.postCorrect=correct;game.postPct=pct;game.postResponses=responses;}showVictorySummary(mode,correct,s.questions.length,responses);return}}
function quizSummary(s,pct){const weak={};s.responses.filter(r=>!r.correct).forEach(r=>weak[r.topic]=(weak[r.topic]||0)+1);const recs=Object.keys(weak).length?Object.keys(weak).map(t=>`<li>Review <strong>${esc(t)}</strong> and revisit the explanation for missed questions.</li>`).join(''):'<li>Excellent work. Try another world to broaden your science knowledge.</li>';shell(`<div class="page-head"><div><div class="eyebrow">Quiz complete</div><h1>Your knowledge snapshot</h1><p>Each answer is a chance to strengthen your understanding.</p></div><button class="back-btn" data-action="home">← Main menu</button></div><div class="content-grid"><section class="panel-card"><div class="result-banner"><div class="result-trophy">${pct>=80?'🏆':'🧠'}</div><div><div class="eyebrow">${esc(worldById(s.world).name)}</div><h2 style="margin:4px 0">${s.correct}/${s.questions.length} correct · ${pct}%</h2><p style="margin:0">${pct>=80?'Strong work — keep exploring.':pct>=60?'Good start. Review the explanations and try again.':'Every mistake is useful data. Study the topics below and retest.'}</p></div></div><div class="stat-grid"><div class="stat-box"><div class="stat-label">Correct</div><div class="stat-value">${s.correct}</div></div><div class="stat-box"><div class="stat-label">Incorrect</div><div class="stat-value">${s.incorrect}</div></div><div class="stat-box"><div class="stat-label">Accuracy</div><div class="stat-value">${pct}%</div></div><div class="stat-box"><div class="stat-label">Hints used</div><div class="stat-value">${2-s.hints}</div></div></div><button class="btn btn-primary full" style="margin-top:17px" data-action="quiz-retry" data-world="${s.world}">Try the 10-question quiz again</button></section><section class="panel-card"><h2>Recommended next steps</h2><ul class="tip-list">${recs}</ul><button class="btn btn-ghost full" data-action="worlds">Explore a world →</button></section></div>`,true)}
function startGame(worldId,runKind='normal',baseline=null){activeWorld=worldId;screen='game';const w=worldById(worldId);const levelWidth=3100;const floorY=470;const platforms=[
{x:0,y:floorY,w:650,h:100},{x:705,y:floorY,w:520,h:100},{x:1280,y:floorY,w:590,h:100},{x:1930,y:floorY,w:510,h:100},{x:2500,y:floorY,w:600,h:100},
{x:310,y:390,w:145,h:18},{x:1440,y:350,w:160,h:18},{x:2650,y:360,w:150,h:18}];

function burst(x,y,n,color){if(!game)return;for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=35+Math.random()*190;game.particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-35,life:.45+Math.random()*.65,maxLife:1,color,r:2+Math.random()*3})}}
function drawGame(now){const c=$('#gameCanvas');if(!c||!game)return;const ctx=c.getContext('2d');ctx.clearRect(0,0,960,540);const w=worldById(game.world),cam=game.cameraX,t=now/1000;
const grad=ctx.createLinearGradient(0,0,0,540);if(game.world==='physics'){grad.addColorStop(0,'#101f43');grad.addColorStop(.65,'#19466b');grad.addColorStop(1,'#0e2d45')}else if(game.world==='chemistry'){grad.addColorStop(0,'#211d50');grad.addColorStop(.65,'#503c7d');grad.addColorStop(1,'#1b274c')}else{grad.addColorStop(0,'#122e3a');grad.addColorStop(.6,'#20585b');grad.addColorStop(1,'#123a39')}ctx.fillStyle=grad;ctx.fillRect(0,0,960,540);
// atmospheric stars and particles
for(let i=0;i<70;i++){const sx=((i*173+35)-(cam*.12)%1120+1120)%1120,sy=(i*71)%340;const alpha=.25+.45*(.5+.5*Math.sin(t*1.8+i));ctx.fillStyle=`rgba(193,235,255,${alpha})`;ctx.beginPath();ctx.arc(sx,sy,((i%3)+1)*.45,0,Math.PI*2);ctx.fill()}
if(game.world==='physics'){for(let i=0;i<5;i++){const x=i*250-(cam*.25%250);ctx.fillStyle='#3f91b91a';ctx.fillRect(x,100,110,310);ctx.strokeStyle='#72cfe424';ctx.strokeRect(x,100,110,310);for(let j=0;j<3;j++){ctx.fillStyle='#73eff01b';ctx.fillRect(x+12,125+j*76,85,3)}}}else if(game.world==='chemistry'){for(let i=0;i<8;i++){const x=(i*210-cam*.18%1200+1200)%1200+5,y=75+(i*67)%220;const r=22+(i%3)*8;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.strokeStyle='#dfc5ff23';ctx.lineWidth=2;ctx.stroke();ctx.beginPath();ctx.arc(x+30,y+18,4,0,Math.PI*2);ctx.fillStyle='#ffcb7c88';ctx.fill()}}else{for(let i=0;i<7;i++){const x=(i*170-cam*.32%1100+1100)%1100-40;ctx.fillStyle='#092d2b88';ctx.beginPath();ctx.ellipse(x,410,43,125,Math.sin(i)*.15,0,Math.PI*2);ctx.fill();for(let j=0;j<4;j++){ctx.beginPath();ctx.ellipse(x+Math.cos(i+j)*28,310+j*24,27,10,Math.sin(i+j),0,Math.PI*2);ctx.fillStyle='#5bce8b26';ctx.fill()}}}
// distant floating motes
for(let i=0;i<10;i++){const x=(i*127+Math.sin(t+i)*22-cam*.2+1200)%1200;const y=130+(i*39)%250+Math.sin(t*1.5+i)*8;ctx.fillStyle=w.color+'44';ctx.beginPath();ctx.arc(x,y,2+(i%3),0,Math.PI*2);ctx.fill()}
// platforms
for(const pl of game.platforms){const x=pl.x-cam;if(x+pl.w<-10||x>970)continue;if(pl.h>30){const g=ctx.createLinearGradient(0,pl.y,0,540);g.addColorStop(0,game.world==='biology'?'#246f58':'#244d70');g.addColorStop(1,'#091b2e');ctx.fillStyle=g;ctx.fillRect(x,pl.y,pl.w,pl.h);ctx.fillStyle=w.color;ctx.globalAlpha=.65;ctx.fillRect(x,pl.y,pl.w,4);ctx.globalAlpha=1;for(let z=0;z<pl.w;z+=32){ctx.fillStyle='#b7faff0c';ctx.fillRect(x+z,pl.y+15,15,2)}}else{ctx.fillStyle=game.world==='biology'?'#317c69':game.world==='chemistry'?'#6b5ca1':'#347c9d';ctx.beginPath();ctx.roundRect(x,pl.y,pl.w,pl.h,7);ctx.fill();ctx.fillStyle=w.color;ctx.fillRect(x+3,pl.y,pl.w-6,3);ctx.fillStyle='#ffffff14';ctx.fillRect(x+9,pl.y+8,pl.w-18,2)}}
// hazards
for(const h of game.hazards){const x=h.x-cam;if(x<-50||x>1000)continue;ctx.fillStyle='#ff8d6e';ctx.beginPath();ctx.moveTo(x,h.y+h.h);ctx.lineTo(x+h.w/2,h.y-12);ctx.lineTo(x+h.w,h.y+h.h);ctx.closePath();ctx.fill();ctx.fillStyle='#ffe9b8';ctx.beginPath();ctx.moveTo(x+10,h.y+h.h-2);ctx.lineTo(x+h.w/2,h.y-4);ctx.lineTo(x+h.w-10,h.y+h.h-2);ctx.closePath();ctx.fill()}
// crystals
for(const cr of game.crystals){if(cr.got)continue;const x=cr.x-cam,y=cr.y+Math.sin(t*2+cr.phase)*5;if(x<-30||x>990)continue;ctx.save();ctx.translate(x,y);ctx.rotate(Math.sin(t+cr.phase)*.12);ctx.shadowColor='#73fff1';ctx.shadowBlur=21;ctx.fillStyle='#6af1e6';ctx.beginPath();ctx.moveTo(0,-13);ctx.lineTo(10,-3);ctx.lineTo(7,9);ctx.lineTo(0,14);ctx.lineTo(-8,6);ctx.lineTo(-10,-5);ctx.closePath();ctx.fill();ctx.shadowBlur=0;ctx.strokeStyle='#e3fffb';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(0,-10);ctx.lineTo(1,8);ctx.moveTo(-7,-2);ctx.lineTo(6,2);ctx.stroke();ctx.restore()}
// objects
for(const o of game.objects){const x=o.x-cam,y=o.y;if(x<-70||x>1010)continue;ctx.save();const glow=o.id==='station'&&!game.missionSolved||o.id==='exit'&&game.missionSolved||o.id==='item'&&!game.itemCollected;ctx.shadowColor=glow?w.color:'#77e7e8';ctx.shadowBlur=glow?24:7;if(o.id==='checkpoint'){ctx.fillStyle=o.used?'#83f4bd':'#fbd58d';ctx.fillRect(x+14,y,5,44);ctx.fillStyle=o.used?'#69e8ac':'#ffc86b';ctx.beginPath();ctx.moveTo(x+19,y+2);ctx.lineTo(x+39,y+10);ctx.lineTo(x+19,y+20);ctx.closePath();ctx.fill();ctx.beginPath();ctx.ellipse(x+15,y+46,17,5,0,0,Math.PI*2);ctx.fillStyle='#101d2f';ctx.fill()}else{ctx.fillStyle=o.id==='exit'?(game.missionSolved?'#75f5da':'#d69483'):o.id==='station'?(game.missionSolved?'#80f4ad':'#83d8f0'):'#ffe08a';ctx.beginPath();if(o.id==='exit'){ctx.roundRect(x,y,o.w,o.h,15)}else{ctx.roundRect(x,y,o.w,o.h,9)}ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#102a42';ctx.font='bold 22px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(o.id==='exit'?'↗':o.id==='station'?(game.missionSolved?'✓':'✧'):o.icon==='🔋'?'ϟ':'✦',x+o.w/2,y+o.h/2)}if(game.nearObject===o&&!game.challengeOpen){ctx.shadowBlur=0;ctx.fillStyle='#f2fbff';ctx.font='bold 11px system-ui';ctx.textAlign='center';ctx.fillText(o.label,x+o.w/2,y-10+Math.sin(t*3)*2)}ctx.restore()}
// scientist character
const p=game.player,px=p.x-cam,py=p.y;ctx.save();ctx.translate(px+p.w/2,py+p.h/2);ctx.scale(p.facing,1);ctx.fillStyle='#081a28';ctx.globalAlpha=.32;ctx.beginPath();ctx.ellipse(0,p.h/2+4,18,5,0,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;ctx.translate(-p.w/2,-p.h/2);
// legs and boots
ctx.fillStyle='#4e7198';ctx.fillRect(5,32,8,12);ctx.fillRect(18,32,8,12);ctx.fillStyle='#1b3451';ctx.beginPath();ctx.roundRect(2,40,13,6,3);ctx.roundRect(16,40,13,6,3);ctx.fill();
// arms
ctx.strokeStyle='#f3bd91';ctx.lineWidth=6;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(5,19);ctx.lineTo(1,29);ctx.moveTo(25,19);ctx.lineTo(29,27);ctx.stroke();
// coat
ctx.fillStyle='#eff7ff';ctx.beginPath();ctx.moveTo(7,15);ctx.lineTo(23,15);ctx.lineTo(28,36);ctx.lineTo(2,36);ctx.closePath();ctx.fill();ctx.fillStyle='#69d6d5';ctx.beginPath();ctx.moveTo(12,16);ctx.lineTo(18,16);ctx.lineTo(20,35);ctx.lineTo(10,35);ctx.closePath();ctx.fill();ctx.strokeStyle='#91b7d3';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(8,18);ctx.lineTo(14,23);ctx.lineTo(12,35);ctx.moveTo(22,18);ctx.lineTo(16,23);ctx.stroke();
// head
ctx.fillStyle='#efb58b';ctx.beginPath();ctx.roundRect(5,2,20,19,7);ctx.fill();ctx.fillStyle='#493453';ctx.beginPath();ctx.moveTo(4,10);ctx.lineTo(4,5);ctx.quadraticCurveTo(13,-4,24,4);ctx.lineTo(26,11);ctx.lineTo(21,7);ctx.lineTo(15,6);ctx.lineTo(8,10);ctx.closePath();ctx.fill();ctx.fillStyle='#263550';ctx.beginPath();ctx.arc(12,12,1.4,0,Math.PI*2);ctx.arc(20,12,1.4,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#9f5262';ctx.lineWidth=1.3;ctx.beginPath();ctx.moveTo(13,16);ctx.quadraticCurveTo(16,18,19,16);ctx.stroke();ctx.strokeStyle='#a8c7df';ctx.lineWidth=2;ctx.beginPath();ctx.arc(15,10,14,Math.PI*1.1,Math.PI*1.9);ctx.stroke();ctx.restore();
// checkpoint hint line and finish glow
if(game.messageUntil>Date.now()){ctx.save();ctx.globalAlpha=Math.min(1,(game.messageUntil-Date.now())/250);ctx.fillStyle='#07172a';ctx.strokeStyle='#93dfe1';ctx.lineWidth=1;ctx.beginPath();ctx.roundRect(180,18,600,38,12);ctx.fill();ctx.stroke();ctx.fillStyle='#edfaff';ctx.font='bold 14px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(game.message,480,37);ctx.restore()}
// particles
for(const p of game.particles){ctx.globalAlpha=Math.max(0,p.life/(p.maxLife||1));ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x-cam,p.y,p.r,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;
// parallax HUD small progress marker
ctx.fillStyle='#061728aa';ctx.beginPath();ctx.roundRect(18,500,290,24,8);ctx.fill();ctx.fillStyle='#bbd5e8';ctx.font='11px system-ui';ctx.textAlign='left';ctx.fillText('EXPEDITION PROGRESS',28,515);ctx.fillStyle='#1e4961';ctx.fillRect(183,508,110,7);ctx.fillStyle=w.color;ctx.fillRect(183,508,110*Math.min(1,game.player.x/game.levelWidth),7);
const cs=$('#hudCrystals'),ss=$('#hudScore');if(cs)cs.textContent=game.crystalsFound;if(ss)ss.textContent=game.score;}
function ensureAudio(){if(!save.settings.sound&&!save.settings.music)return;try{if(!audioCtx){const AC=window.AudioContext||window.webkitAudioContext;if(AC)audioCtx=new AC()}if(audioCtx?.state==='suspended')audioCtx.resume()}catch(e){}}
function playTone(freq,duration,type='sine',gain=.045,delay=0){try{if(!save.settings.sound||!audioCtx)return;const osc=audioCtx.createOscillator(),g=audioCtx.createGain();osc.type=type;osc.frequency.setValueAtTime(freq,audioCtx.currentTime+delay);g.gain.setValueAtTime(.0001,audioCtx.currentTime+delay);g.gain.exponentialRampToValueAtTime(gain,audioCtx.currentTime+delay+.012);g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+delay+duration);osc.connect(g);g.connect(audioCtx.destination);osc.start(audioCtx.currentTime+delay);osc.stop(audioCtx.currentTime+delay+duration+.03)}catch(e){}}
function playSfx(kind){ensureAudio();if(kind==='jump'){playTone(260,.11,'triangle',.03);playTone(390,.1,'sine',.02,.04)}else if(kind==='collect'){playTone(740,.1,'sine',.04);playTone(990,.16,'sine',.035,.07)}else if(kind==='correct'){playTone(520,.12,'triangle',.04);playTone(690,.18,'triangle',.04,.1)}else if(kind==='wrong'){playTone(180,.18,'triangle',.035)}else if(kind==='victory'){[523,659,784,1047].forEach((n,i)=>playTone(n,.22,'triangle',.04,i*.12))}}
function setMusic(on){save.settings.music=on;persist();if(!on){if(musicTimer)clearInterval(musicTimer);musicTimer=null;return}ensureAudio();if(!audioCtx)return;if(musicTimer)clearInterval(musicTimer);const notes=[261.63,329.63,392,329.63,293.66,349.23,440,392];musicStep=0;musicTimer=setInterval(()=>{if(screen==='game'&&game?.paused)return;const freq=notes[musicStep%notes.length];try{const osc=audioCtx.createOscillator(),g=audioCtx.createGain();osc.type='sine';osc.frequency.value=freq;g.gain.setValueAtTime(.0001,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.012,audioCtx.currentTime+.04);g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+.34);osc.connect(g);g.connect(audioCtx.destination);osc.start();osc.stop(audioCtx.currentTime+.36)}catch(e){}musicStep++},390)}
// Keep browser-managed UI and game timers resilient when tabs are hidden.
document.addEventListener('visibilitychange',()=>{if(document.hidden&&screen==='game'&&game&&!game.paused)pauseGame()});
// Header/navigation buttons are available on each screen through delegation.
app.addEventListener('click',e=>{const target=e.target.closest('[data-action]');if(!target)return;const action=target.dataset.action;if(action==='research'&&screen!=='research')researchScreen();if(action==='howto'&&screen!=='howto')howToScreen();if(action==='achievements'&&screen!=='achievements')achievementsScreen();if(action==='stats'&&screen!=='stats')statsScreen()});
// Initial entry point.
mainMenu();
})();
